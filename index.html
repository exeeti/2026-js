<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Формы паролей</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Формы паролей</h1>
  <main id="forms-container"></main>
  <button type="button" class="btn btn-add">Добавить форму</button>

  <template id="password-template">
    <div class="password-form">
        <div class="input-area">
            <div class="input-row">
                <input type="password" class="password-input" placeholder="Введите пароль..." autocomplete="off" aria-label="Пароль">
            </div>
            <div class="password-output">
                <span class="placeholder">здесь будет пароль</span>
            </div>
        </div>

        <div class="vowels-area">
            <label class="vowel-checkbox" data-vowel="a"><input type="checkbox" data-vowel="a"> a</label>
            <label class="vowel-checkbox" data-vowel="e"><input type="checkbox" data-vowel="e"> e</label>
            <label class="vowel-checkbox" data-vowel="i"><input type="checkbox" data-vowel="i"> i</label>
            <label class="vowel-checkbox" data-vowel="o"><input type="checkbox" data-vowel="o"> o</label>
            <label class="vowel-checkbox" data-vowel="u"><input type="checkbox" data-vowel="u"> u</label>
            <label class="vowel-checkbox" data-vowel="y"><input type="checkbox" data-vowel="y"> y</label>
        </div>

        <div class="form-actions">
            <button type="button" class="btn btn-toggle show-toggle">👁️ Показать</button>
            <button type="button" class="btn btn-delete delete-form">✕ Удалить</button>
        </div>
    </div>
  </template>
</body>
</html>
